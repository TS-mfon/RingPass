name: Build RingPass APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Run unit tests, lint, and build debug APK
        run: gradle testDebugUnitTest lintDebug assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RingPass-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Enable KVM for the Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Assemble Android smoke tests
        run: gradle -PringpassTestFixtures=true assembleDebugAndroidTest :test-fixtures:whatsapp:assembleDebug

      - name: Exercise cellular and WhatsApp notifications under DND on Android 15
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim
          script: bash .github/scripts/emulator-smoke-test.sh

  signed-apk:
    needs: build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    steps:
      - name: Check signing configuration
        id: signing
        env:
          KEYSTORE: ${{ secrets.RINGPASS_SIGNING_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.RINGPASS_SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RINGPASS_SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RINGPASS_SIGNING_KEY_PASSWORD }}
          CERT_SHA256: ${{ vars.RINGPASS_SIGNING_CERT_SHA256 }}
        run: |
          if [[ -z "$KEYSTORE$STORE_PASSWORD$KEY_ALIAS$KEY_PASSWORD$CERT_SHA256" ]]; then
            echo 'Signed APK skipped because no RingPass signing identity is configured.' >> "$GITHUB_STEP_SUMMARY"
          elif [[ -z "$KEYSTORE" || -z "$STORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$CERT_SHA256" ]]; then
            echo 'RingPass signing requires its keystore, store password, key alias, and certificate fingerprint.' >&2
            exit 1
          else
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: steps.signing.outputs.enabled == 'true'
        with:
          persist-credentials: false

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        if: steps.signing.outputs.enabled == 'true'
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        if: steps.signing.outputs.enabled == 'true'
        with:
          gradle-version: '8.11.1'

      - name: Build release APK
        if: steps.signing.outputs.enabled == 'true'
        run: gradle assembleRelease

      - name: Sign and verify release APK
        if: steps.signing.outputs.enabled == 'true'
        env:
          RINGPASS_SIGNING_KEYSTORE_B64: ${{ secrets.RINGPASS_SIGNING_KEYSTORE_B64 }}
          RINGPASS_SIGNING_STORE_PASSWORD: ${{ secrets.RINGPASS_SIGNING_STORE_PASSWORD }}
          RINGPASS_SIGNING_KEY_ALIAS: ${{ secrets.RINGPASS_SIGNING_KEY_ALIAS }}
          RINGPASS_SIGNING_KEY_PASSWORD: ${{ secrets.RINGPASS_SIGNING_KEY_PASSWORD }}
          RINGPASS_SIGNING_CERT_SHA256: ${{ vars.RINGPASS_SIGNING_CERT_SHA256 }}
        run: |
          bash .github/scripts/sign-apk.sh \
            app/build/outputs/apk/release/app-release-unsigned.apk \
            app/build/outputs/apk/release/RingPass-signed.apk

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: steps.signing.outputs.enabled == 'true'
        with:
          name: RingPass-signed-apk
          path: app/build/outputs/apk/release/RingPass-signed.apk
          if-no-files-found: error
